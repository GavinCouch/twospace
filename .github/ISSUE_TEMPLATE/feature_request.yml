name: Feature request
description: Suggest a change or something new to do together.
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the situation where this would help.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Optional examples, sketches, or alternatives.
