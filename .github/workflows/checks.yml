name: Checks
on:
  pull_request:
  push:
    branches: [main, build-twospace]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:ios
        env:
          EXPO_PUBLIC_API_URL: https://twospace.online
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: twospace_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: twospace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twospace_test -d twospace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/server/postgres.test.ts
        env:
          TWOSPACE_TEST_POSTGRES_URL: postgresql://twospace_test:local-test-password@127.0.0.1:5432/twospace_test
